name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with workflow projects
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy

      - name: Select Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Check source shape
        run: scripts/check-source-shape.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings

  auto-edit:
    name: Automatic editing workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lightflow-auto-editing
    steps:
      - name: Checkout with workflow projects
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy

      - name: Select Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Check workflow crate formatting
        run: cargo fmt --check

      - name: Test workflow crates
        run: cargo test

      - name: Lint workflow crates
        run: cargo clippy --all-targets -- -D warnings

      - name: Validate automatic edit node
        run: cargo run --quiet --manifest-path ../../Cargo.toml --bin lfw -- node test lightflow.video_auto_edit

      - name: Validate planning node
        run: cargo run --quiet --manifest-path ../../Cargo.toml --bin lfw -- node test lightflow.video_auto_edit_plan

      - name: Validate rendering node
        run: cargo run --quiet --manifest-path ../../Cargo.toml --bin lfw -- node test lightflow.video_render_edit

  rig:
    name: Rig workflow project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lightflow-rig
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - run: rustup default "$RUST_VERSION"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  flux:
    name: Flux workflow project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lightflow-flux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - run: rustup default "$RUST_VERSION"
      - run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p lightflow-flux-runtime --features native
      - name: Test native runner seam and optional real-model smoke
        run: cargo test -p lightflow-flux-text-to-image --features native-test-seam --test native_acceptance
      - name: Verify publish package manifests
        run: cargo package --workspace --list --allow-dirty
      - name: Enforce native sys crate size
        run: |
          cargo package -p lightflow-flux-native-sys --allow-dirty --no-verify
          crate=target/package/lightflow-flux-native-sys-0.1.0.crate
          bytes=$(stat -c%s "$crate")
          test "$bytes" -le $((10 * 1024 * 1024))
